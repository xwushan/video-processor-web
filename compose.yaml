services:
  video-processor:
    image: video-processor-web:${VIDEO_PROCESSOR_IMAGE_TAG:-local}
    build:
      context: .
      args:
        VCS_REF: ${VIDEO_PROCESSOR_REVISION:-unknown}
    init: true
    restart: unless-stopped
    ports:
      - "${VIDEO_PROCESSOR_BIND_IP:-0.0.0.0}:${VIDEO_PROCESSOR_PORT:-8899}:8899"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      VIDEO_PROCESSOR_ROOT: /data/video-processor
      VIDEO_PROCESSOR_ENCODER_DEVICE: ${VIDEO_PROCESSOR_ENCODER_DEVICE:-auto}
      VIDEO_PROCESSOR_GPU_MAX_CONCURRENT: ${VIDEO_PROCESSOR_GPU_MAX_CONCURRENT:-8}
      VIDEO_PROCESSOR_GPU_CPU_THREADS: ${VIDEO_PROCESSOR_GPU_CPU_THREADS:-4}
      VIDEO_PROCESSOR_FILE_RETENTION_DAYS: ${VIDEO_PROCESSOR_FILE_RETENTION_DAYS:-14}
      VIDEO_PROCESSOR_RECORD_RETENTION_DAYS: ${VIDEO_PROCESSOR_RECORD_RETENTION_DAYS:-90}
      VIDEO_PROCESSOR_MAX_UPLOAD_MB: ${VIDEO_PROCESSOR_MAX_UPLOAD_MB:-8192}
      VIDEO_PROCESSOR_MIN_FREE_GB: ${VIDEO_PROCESSOR_MIN_FREE_GB:-20}
      VIDEO_PROCESSOR_ARCHIVE_RETENTION_HOURS: ${VIDEO_PROCESSOR_ARCHIVE_RETENTION_HOURS:-24}
      VIDEO_PROCESSOR_UPLOAD_SESSION_RETENTION_HOURS: ${VIDEO_PROCESSOR_UPLOAD_SESSION_RETENTION_HOURS:-24}
      VIDEO_PROCESSOR_H264_PRESET: ${VIDEO_PROCESSOR_H264_PRESET:-veryfast}
      VIDEO_PROCESSOR_H265_PRESET: ${VIDEO_PROCESSOR_H265_PRESET:-fast}
      VIDEO_PROCESSOR_MKV_PRESET: ${VIDEO_PROCESSOR_MKV_PRESET:-veryfast}
      VIDEO_PROCESSOR_WECHAT_WEBHOOK: ${VIDEO_PROCESSOR_WECHAT_WEBHOOK:-}
      VIDEO_PROCESSOR_PUBLIC_URL: ${VIDEO_PROCESSOR_PUBLIC_URL:-}
      VIDEO_PROCESSOR_AUTH_USER: ${VIDEO_PROCESSOR_AUTH_USER:-admin}
      VIDEO_PROCESSOR_AUTH_PASSWORD: ${VIDEO_PROCESSOR_AUTH_PASSWORD:-}
    volumes:
      - video-data:/data/video-processor
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  video-data:
