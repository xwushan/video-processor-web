name: Validate release

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-dev.txt
      - name: Regression and dependency checks
        run: |
          python -m unittest discover -s tests -v
          python -m pip_audit -r requirements-web.txt
          node --check web_app/static/app.js
          git diff --check
      - name: Check production configuration
        env:
          VIDEO_PROCESSOR_AUTH_PASSWORD: ci-config-only
          VIDEO_PROCESSOR_IMAGE_TAG: ${{ github.sha }}
          VIDEO_PROCESSOR_REVISION: ${{ github.sha }}
        run: docker compose -f compose.yaml -f compose.nvidia.yaml -f compose.production.yaml config --quiet
      - name: Build and validate CPU container
        env:
          VIDEO_PROCESSOR_MIN_FREE_GB: '0'
          VIDEO_PROCESSOR_ENCODER_DEVICE: cpu
          VIDEO_PROCESSOR_REVISION: ${{ github.sha }}
        run: |
          docker compose build
          docker compose up -d --wait --wait-timeout 90
          python deploy/validate_docker.py
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop test container
        if: always()
        run: docker compose down
